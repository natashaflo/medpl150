      <h1>Readings and reflections</h1>     
      Capturing images is an opportunity to create stills of moments in life that I would want to look back on and relive or reflect on in the future. Images are snapshots of the world taken from our perspective and often are “pieces of reality” as Sontag states. Photography is something I’ve enjoyed since I was usually the one in charge of taking photos during family events so as I got older, I found photography as a way for me to be creative and take photos of things that made me feel inspired, pensive, or something that I feel others should see. Taking photos of mundane things like sidewalks, stairs, buildings, anything that feels uncanny is one of my favorite things to do as I find beauty in the mundane world. The average everyday things that we tend to ignore and look past are amongst my favorite things to capture.  
Creating graphics are similar to photography in that you are creating a visual representation of an idea or story or presenting an aesthetic. It is a tool that allows me to enhance what I have captured and altar it in a way where I can emphasize certain details that I feel are important and essential to the idea I’m trying to convey. Sontag’s statement that photographs are like Plato's cave resonate with me now because in an age where video and photos are so easily accessible and gives people the illusion of possessing power it can be used to alter perceptions of moments and encourage others to blindly believe what they are presenting as photos are ‘factual’ in the sense that they are tangible and can replace reality.  
For me, taking photographs has always been to capture important moments in my life or in the lives of those around me. Things like birthdays, trips, and celebrations were the only reason I was allowed to use film as they were only to be used sparingly. However, now with how accessible digital media is I am able to capture everything and anything that provokes some form of thought or emotion. In the world we live in, Sontangs emphasis on how photography can be damaging and alter the way in which we capture the world and how we influence others is extremely relevant. Photography combined with image making allows me to present what I want and how I want others to perceive it. Using tools like photoshop allows me to input things like text to add to what it I already have. Image editing tools allow me to create something from scratch. 
When creating images, I’d like to utilize these tools like photoshop to create images that do not exist in reality but in my head. I am very interested in surreal photography, which is a combination of both photography and image making. Artists like Hieronymus Bosch, whose surrealist art depicts elements of reality and absurdity, are pieces of art that I am inspired by and would like to depict the current state of the world in.
